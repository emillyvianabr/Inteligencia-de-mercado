<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inteligência de mercado | Grupo Iter</title>
<meta name="description" content="Painéis e análises que acompanham o mercado dos parques do Grupo Iter, reunidos em um só lugar.">
<meta name="theme-color" content="#4b4f9e">
<link rel="icon" type="image/png" href="assets/img/favicon.png">
<link rel="preload" href="assets/fonts/Stolzl-Bold.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/Stolzl-Light.woff2" as="font" type="font/woff2" crossorigin>
<!-- Para o site não aparecer em buscas do Google, tire os comentários da linha abaixo:
<meta name="robots" content="noindex, nofollow">
-->
<link rel="stylesheet" href="estilo.css">
</head>
<body>

  <header class="topo">
    <img class="topo__apoio" src="assets/img/symbol-white.png" alt="" aria-hidden="true">
    <div class="topo__in">
      <div class="topo__barra">
        <a href="index.html" aria-label="Grupo Iter, página inicial">
          <img class="topo__logo" src="assets/img/logo-grupo-iter-white.png" alt="Grupo Iter">
        </a>
        <nav class="topo__nav" aria-label="Seções da página">
          <a href="#paineis">Painéis</a>
          <a href="#newsletter">Newsletter</a>
        </nav>
      </div>

      <div class="topo__hero">
        <h1>Inteligência de mercado</h1>
        <p class="topo__lede">Os painéis e análises que acompanham o mercado dos nossos parques, reunidos em um só lugar. Escolha um painel para abrir.</p>
      </div>
    </div>
  </header>

  <main class="layout">
    <div class="paineis" id="paineis">
      <h2 class="so-leitor">Painéis por parque</h2>
      <noscript><p>Ative o JavaScript do navegador para ver a lista de painéis.</p></noscript>
    </div>

    <aside class="lateral" id="newsletter" aria-label="Newsletter"></aside>
  </main>

  <footer class="rodape">
    <div class="rodape__in">
      <img src="assets/img/logo-grupo-iter-color.png" alt="Grupo Iter">
      <p id="rodape-texto">Painéis e análises de inteligência de mercado.</p>
    </div>
  </footer>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
