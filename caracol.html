<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parque do Caracol — Inteligência de Mercado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --fundo-1: #16281B;
    --fundo-2: #081109;
    --acc: #7FAF7A;
    --creme: #F1EAD9;
  }
  *{ box-sizing: border-box; margin:0; padding:0; }
  html, body{
    min-height: 100%;
    font-family: 'Inter', sans-serif;
    background: linear-gradient(160deg, var(--fundo-1) 0%, var(--fundo-2) 100%);
    color: var(--creme);
  }
  .envolvedor{
    max-width: 760px;
    margin: 0 auto;
    padding: 3.2rem 1.8rem 4rem;
  }
  .voltar{
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    color: var(--acc);
    text-decoration: none;
    font-size: 0.9rem;
    margin-bottom: 2.4rem;
  }
  .voltar .seta-volta{
    width: 8px; height: 8px;
    border-left: 1.5px solid currentColor;
    border-bottom: 1.5px solid currentColor;
    transform: rotate(45deg);
  }
  .rotulo{
    font-size: 0.78rem;
    letter-spacing: 0.03em;
    color: var(--acc);
    margin-bottom: 0.6rem;
  }
  h1{
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: clamp(2rem, 6vw, 2.9rem);
    line-height: 1.05;
    margin-bottom: 2.6rem;
  }
  .lista{
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }
  .cartao{
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    padding: 1.4rem 1.6rem;
    border: 1px solid rgba(241,234,217,0.18);
    border-radius: 4px;
    text-decoration: none;
    color: var(--creme);
    background: rgba(241,234,217,0.04);
    transition: background 0.2s ease, border-color 0.2s ease;
  }
  .cartao:hover{
    background: rgba(241,234,217,0.09);
    border-color: rgba(241,234,217,0.35);
  }
  .cartao h2{
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 1.15rem;
  }
  .cartao span.desc{
    display: block;
    font-size: 0.85rem;
    color: rgba(241,234,217,0.6);
    margin-top: 0.25rem;
  }
  .cartao .seta{
    flex-shrink: 0;
    width: 9px; height: 9px;
    border-right: 1.5px solid currentColor;
    border-bottom: 1.5px solid currentColor;
    transform: rotate(-45deg);
  }
</style>
</head>
<body>
  <div class="envolvedor">
    <a class="voltar" href="index.html"><span class="seta-volta"></span> Painéis dos parques</a>

    <div class="rotulo">inteligência de mercado</div>
    <h1>Parque do Caracol</h1>

    <div class="lista">
      <a class="cartao" href="https://emillyvianabr.github.io/tarifarios_caracol/">
        <div>
          <h2>Tarifários</h2>
          <span class="desc">Preços praticados pela concorrência</span>
        </div>
        <span class="seta"></span>
      </a>

      <a class="cartao" href="https://emillyvianabr.github.io/monitor-tarifas/">
        <div>
          <h2>Monitor de Tarifas Aéreas</h2>
          <span class="desc">Acompanhamento de tarifas aéreas de Porto Alegre</span>
        </div>
        <span class="seta"></span>
      </a>

      <a class="cartao" href="https://emillyvianabr.github.io/hotelaria_gramado/">
        <div>
          <h2>Hotelaria em Gramado e Canela</h2>
          <span class="desc">Panorama do setor hoteleiro na região de Gramado e Canela</span>
        </div>
        <span class="seta"></span>
      </a>
    </div>
  </div>
</body>
</html>
